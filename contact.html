<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oura Identity - Advertiser Portal</title>

  <!-- Global Portal Security Guard (Session Based) -->
  <script>
    if (sessionStorage.getItem("oura_portal_auth") !== "unlocked") {
      alert("🔒 System Restricted! Please enter the Passkey on the Security Gate first.");
      window.location.href = "index.html";
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Top Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">Oura Identity</h1>
        <nav class="hidden md:flex space-x-4 text-sm font-medium">
          <a href="dashboard.html" class="text-slate-400 hover:text-white transition">Tool Hub</a>
          <a href="operations.html" class="text-slate-400 hover:text-white transition">Operations & Staff</a>
          <a href="ai-tools.html" class="text-slate-400 hover:text-white transition">AI Script & Rates</a>
          <a href="contact.html" class="text-blue-400 border-b-2 border-blue-400 pb-1">Advertiser Portal</a>
        </nav>
      </div>
      <div class="flex items-center space-x-4">
        <button onclick="sessionStorage.removeItem('oura_portal_auth'); window.location.href='index.html';" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg transition">
          Lock System Access
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content / Booking Form -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="mb-8">
      <h2 class="text-2xl font-bold tracking-tight text-white">Advertiser Campaign Booking</h2>
      <p class="text-sm text-slate-400 mt-1">Submit your campaign details to launch your digital advertising workflow.</p>
    </div>

    <!-- Advertiser Booking Form -->
    <form id="advertiserForm" class="p-6 bg-slate-900/60 border border-slate-800 rounded-2xl space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
          <input type="text" id="clientName" required placeholder="Your Name" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
          <input type="email" id="clientEmail" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Brand Name / Agency</label>
        <input type="text" id="clientBrand" required placeholder="Brand Name" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Campaign Goal / Services Needed</label>
        <textarea id="clientGoal" rows="3" required placeholder="Describe your ad requirements..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
      </div>

      <button type="submit" id="submitLeadBtn" class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm rounded-lg transition">
        Submit Campaign Request
      </button>
    </form>

    <div id="bookingResult" class="mt-6 hidden p-6 bg-slate-900/60 border border-slate-800 rounded-2xl"></div>
  </main>

  <!-- External Contact Logic Script -->
  <script src="contact.js"></script>
</body>
</html>
