<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oura Identity - AI Script Generator</title>

  <!-- Global Portal Security Guard (Session Based) -->
  <script>
    if (sessionStorage.getItem("oura_portal_auth") !== "unlocked") {
      alert("🔒 System Restricted! Please enter the Passkey on the Security Gate first.");
      window.location.href = "index.html";
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Top Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">Oura Identity</h1>
        <nav class="hidden md:flex space-x-4 text-sm font-medium">
          <a href="dashboard.html" class="text-slate-400 hover:text-white transition">Tool Hub</a>
          <a href="operations.html" class="text-slate-400 hover:text-white transition">Operations & Staff</a>
          <a href="ai-tools.html" class="text-blue-400 border-b-2 border-blue-400 pb-1">AI Script & Rates</a>
          <a href="contact.html" class="text-slate-400 hover:text-white transition">Advertiser Portal</a>
        </nav>
      </div>
      <div class="flex items-center space-x-4">
        <button onclick="sessionStorage.removeItem('oura_portal_auth'); window.location.href='index.html';" class="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg transition">
          Lock System Access
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold text-white mb-2">AI Commercial Script Generator</h2>
    <p class="text-sm text-slate-400 mb-6">Generate high-converting 30-second video ad scripts using Gemini AI.</p>

    <!-- Script Generator Form -->
    <form id="scriptForm" class="p-6 bg-slate-900/60 border border-slate-800 rounded-2xl space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Brand Name / Product</label>
        <input type="text" id="brandName" required placeholder="e.g. Oura Identity" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Target Audience</label>
        <input type="text" id="targetAudience" required placeholder="e.g. Small Business Owners" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>
      <button type="submit" id="generateBtn" class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm rounded-lg transition">
        Generate Commercial Script
      </button>
    </form>

    <div id="scriptResult" class="mt-6 hidden p-6 bg-slate-900/60 border border-slate-800 rounded-2xl"></div>
  </main>

  <script>
    document.getElementById("scriptForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const brandName = document.getElementById("brandName").value;
      const targetAudience = document.getElementById("targetAudience").value;
      const resultBox = document.getElementById("scriptResult");
      const submitBtn = document.getElementById("generateBtn");

      submitBtn.disabled = true;
      submitBtn.innerText = "Generating AI Script...";
      resultBox.classList.remove("hidden");
      resultBox.innerHTML = "<p class='text-slate-400 animate-pulse'>🤖 Gemini AI commercial script generate kar raha hai, please wait...</p>";

      try {
        const response = await fetch("YOUR_N8N_WEBHOOK_URL_HERE", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            brand_name: brandName,
            target_audience: targetAudience
          })
        });

        const data = await response.json();

        if (data && data.script) {
          resultBox.innerHTML = `
            <h4 class="text-emerald-400 font-bold mb-2">✓ AI Script Generated Successfully</h4>
            <div class="text-slate-200 whitespace-pre-line text-sm leading-relaxed bg-slate-950 p-4 rounded-lg border border-slate-800">
              ${data.script}
            </div>
          `;
        } else {
          resultBox.innerHTML = "<p class='text-red-400'>❌ Response aaya par script field nahi mili. n8n workflow check karein.</p>";
        }
      } catch (error) {
        console.error(error);
        resultBox.innerHTML = "<p class='text-red-400'>❌ Webhook trigger me error aaya. Webhook URL check karein.</p>";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Generate Commercial Script";
      }
    });
  </script>
</body>
</html>
